<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(245, 239, 230);
            color: rgb(83, 80, 76);
        }
        .krish{
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 25px 10px;
        }
        .krish a{
            text-decoration: none;
            color: rgb(116, 111, 111);
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
        }
         .raj{
            max-width: 1100px;
            margin: 20px auto;
            padding: 10px;
        }
        .card{
            border: 1px solid #8c817a;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }
        .info{
            flex: 1;
            padding: 20px;
        }
        .info p{
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .info h1{
            font-size: 48pxpx;
            font-weight: normal;
            margin-bottom: 15px;
        }
        .username{
            font-size: 13px;
            font-weight: bold;
            margin-top: 70px;
            margin-bottom: 15px;

        }
        .image{
            flex: 1;
            max-width: 450px;

        }
        .image img{
            width: 100%;
            height: 380px;
            object-fit: cover;
            display: block;
        }
        .rrrr{
            display: flex;
            gap: 18px;
            align-items: center;
        }
        .rrrr a{
            color: #292525;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="krish"><a href="">BIO</a>
        <a href="">PROTFOLIO</a>
        <a href="">PODCAST</a>
        <a href="">BLOG</a>        
    </div>
    <div class="raj">
        <div class="card">
            <div class="info">
                <h1>bethany jones</h1>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Eius dolorem Lorem ipsum dolor sit amet consectetur adipisicing elit. Porro distinctio nemo eveniet         .</p>
                <div class="username">@reallygratsite</div>
                <div class="rrrr"><a href="" title="instagram">in</a>
                    <a href="" title="facebook">f</a>
                    <a href="" title="twitter">tw</a>
                    <a href="" title="linkedin">li</a>
                </div>
            </div>
            <div class="image">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR1cBgk9ohcedmBmWlghTvTAj_o2862hf4nRZ4fZc4FfQ&s=10" alt="bethany jones">
            </div>
        </div>
    </div>
</body>
</html>
